<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="BEYOND SAGITTARIUS: A Survival Story Beyond the Known Universe. An original 3D story-survival browser game." />
    <meta name="theme-color" content="#05070d" />
    <title>BEYOND SAGITTARIUS: A Survival Story Beyond the Known Universe</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Fonts: Google Fonts (SIL Open Font License). See CREDITS.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@300;400;600&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body class="lang-en">
    <canvas id="c"></canvas>

    <div id="fade" class="fade"></div>

    <!-- Loading -->
    <div id="loading" class="screen">
      <div class="loader-ring"></div>
      <div class="loader-text" data-i18n="menu.loading"></div>
      <div class="loader-bar"><div id="loader-fill"></div></div>
    </div>

    <!-- Title -->
    <div id="title" class="screen hidden">
      <div class="title-block">
        <div class="title-kicker">2189</div>
        <h1 class="game-title"><img class="game-logo" src="/brand/logo.svg" alt="" width="737" height="230" /><span class="game-name" data-i18n="title.name"></span></h1>
        <div class="game-subtitle" data-i18n="title.subtitle"></div>
        <p class="tagline" data-i18n="title.tagline"></p>
        <div class="menu">
          <button id="btn-continue" class="btn primary hidden" data-i18n="menu.continue"></button>
          <button id="btn-new" class="btn primary" data-i18n="menu.newGame"></button>
          <button id="btn-settings" class="btn" data-i18n="menu.settings"></button>
          <a id="btn-download" class="btn hidden" href="https://github.com/megazron/beyond-sagittarius/releases/latest" target="_blank" rel="noopener" data-i18n="menu.download"></a>
          <button id="btn-quit-desktop" class="btn hidden" data-i18n="menu.quitDesktop"></button>
          <div class="lang-row">
            <span class="lang-label" data-i18n="menu.language"></span>
            <button class="btn lang" data-lang="en">English</button>
            <button class="btn lang" data-lang="hi">हिन्दी</button>
            <button class="btn lang" data-lang="ur">اردو</button>
          </div>
          <div class="lang-row">
            <span class="lang-label" data-i18n="settings.subLang"></span>
            <button class="btn sublang" data-sub="same" data-i18n="settings.same"></button>
            <button class="btn sublang" data-sub="en">English</button>
            <button class="btn sublang" data-sub="hi">हिन्दी</button>
            <button class="btn sublang" data-sub="ur">اردو</button>
            <button class="btn sublang" data-sub="off" data-i18n="settings.off"></button>
          </div>
        </div>
      </div>
      <div class="title-foot">
        <span data-i18n="title.slice"></span> · <span data-i18n="menu.quality"></span>: <b id="quality-badge"></b> · <span id="version-badge">v0.1</span> · <button id="btn-legal" class="link-btn" data-i18n="legal.title"></button>
      </div>
    </div>

    <!-- Cinematic overlay -->
    <div id="cine" class="hidden">
      <div id="cine-bars"><div class="bar top"></div><div class="bar bottom"></div></div>
      <div id="chapter" class="chapter hidden"></div>
      <div id="caption" class="caption hidden"></div>
      <div id="mission" class="mission hidden"></div>
      <div id="ai-alert" class="ai-alert hidden"></div>
      <button id="btn-skip" class="btn skip"><span data-i18n="cine.skip"></span> ▸▸</button>
    </div>
    <div id="subtitle" class="subtitle hidden"><span class="speaker"></span><span class="line"></span></div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="stats panel">
        <div class="stat" data-stat="health"><span class="lbl" data-i18n="hud.health"></span><div class="bar"><i></i></div></div>
        <div class="stat" data-stat="thirst"><span class="lbl" data-i18n="hud.thirst"></span><div class="bar"><i></i></div></div>
        <div class="stat" data-stat="hunger"><span class="lbl" data-i18n="hud.hunger"></span><div class="bar"><i></i></div></div>
        <div class="stat" data-stat="stamina"><span class="lbl" data-i18n="hud.stamina"></span><div class="bar"><i></i></div></div>
        <div class="suit"><span data-i18n="hud.suit"></span> · <span data-i18n="hud.noSignal" class="blink"></span></div>
      </div>
      <div class="compass"><div class="compass-strip" id="compass-strip"></div><div class="compass-needle"></div><div class="compass-dist" id="compass-dist"></div></div>
      <div class="clock panel" id="clock"></div>
      <div class="objective panel" id="objective">
        <div class="obj-level" id="obj-level"></div>
        <div class="obj-title" id="obj-title"></div>
        <div class="obj-desc" id="obj-desc"></div>
        <div class="obj-progress" id="obj-progress"></div>
      </div>
      <div class="toasts" id="toasts"></div>
      <div class="prompt hidden" id="prompt"><kbd>E</kbd><span></span></div>
      <div class="inventory panel" id="inventory"></div>
      <div class="help-hint" data-i18n="hud.helpHint"></div>
      <div class="banner hidden" id="banner"><div class="b-title"></div><div class="b-sub"></div></div>
      <div class="memory hidden" id="memory"></div>
      <div class="device hidden" id="device"></div>
      <div id="damage" class="damage"></div>
      <div id="tutorial" class="tutorial panel hidden">
        <div class="tut-head"></div>
        <div class="tut-title"></div>
        <div class="tut-text"></div>
        <div class="tut-bar"><i></i></div>
        <button id="tut-skip" class="tut-skip"></button>
      </div>
      <!-- Touch controls (phones / tablets) -->
      <div id="touch" class="touch-ui hidden">
        <div id="joy-zone" class="joy-zone"><div id="joy" class="joy"><div id="joy-knob" class="joy-knob"></div></div><span class="joy-hint" data-i18n="touch.moveHint"></span></div>
        <div class="touch-menu">
          <button id="tb-pause" class="tbtn sm" aria-label="pause"><i>❚❚</i></button>
          <button id="tb-obj" class="tbtn sm"><i>◎</i><span data-i18n="touch.obj"></span></button>
          <button id="tb-crew" class="tbtn sm"><i>☰</i><span data-i18n="touch.crew"></span></button>
          <button id="tb-inv" class="tbtn sm"><i>▣</i><span data-i18n="touch.inv"></span></button>
        </div>
        <div class="touch-actions">
          <button id="tb-sprint" class="tbtn mid"><i>»</i><span data-i18n="touch.sprint"></span></button>
          <button id="tb-jump" class="tbtn mid"><i>⤒</i><span data-i18n="touch.jump"></span></button>
          <button id="tb-act" class="tbtn big"><i>✋</i><span data-i18n="touch.act"></span></button>
        </div>
      </div>
    </div>

    <!-- Modals -->
    <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
    <div id="fps" class="fps hidden"></div>
    <noscript>This game needs JavaScript and WebGL2.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
