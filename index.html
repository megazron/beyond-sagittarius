<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="BEYOND SAGITTARIUS: A Survival Story Beyond the Known Universe. An original 3D story-survival browser game." />
    <meta name="theme-color" content="#0a0907" />
    <title>BEYOND SAGITTARIUS: A Survival Story Beyond the Known Universe</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  </head>
  <body class="lang-en">
    <canvas id="c"></canvas>

    <div id="fade" class="fade"></div>

    <!-- Loading -->
    <div id="loading" class="screen">
      <div class="loader-text" data-i18n="menu.loading"></div>
      <div class="loader-bar"><div id="loader-fill"></div></div>
    </div>

    <!-- Title -->
    <div id="title" class="screen hidden">
      <div class="title-block">
        <h1 class="game-title"><img class="game-logo" src="/brand/logo.svg" alt="" width="737" height="230" /><span class="game-name" data-i18n="title.name"></span></h1>
        <p class="tagline" data-i18n="title.tagline"></p>
        <div class="menu">
          <button id="btn-continue" class="btn primary hidden" data-i18n="menu.continue"></button>
          <button id="btn-new" class="btn primary" data-i18n="menu.newGame"></button>
          <button id="btn-chapters" class="btn hidden" data-i18n="br.chapters"></button>
          <button id="btn-settings" class="btn" data-i18n="menu.settings"></button>
          <a id="btn-download" class="btn hidden" href="https://github.com/megazron/beyond-sagittarius/releases/latest" target="_blank" rel="noopener" data-i18n="menu.download"></a>
          <button id="btn-quit-desktop" class="btn hidden" data-i18n="menu.quitDesktop"></button>
        </div>
        <div class="lang-row">
          <button class="btn lang" data-lang="en">English</button>
          <button class="btn lang" data-lang="hi">हिन्दी</button>
          <button class="btn lang" data-lang="ur">اردو</button>
        </div>
      </div>
      <div class="title-foot">
        <span data-i18n="title.slice"></span> · <span id="version-badge">v0.1</span> · <span data-i18n="menu.quality"></span> <b id="quality-badge"></b> · <button id="btn-legal" class="link-btn" data-i18n="legal.title"></button>
      </div>
    </div>

    <!-- Cinematic overlay -->
    <div id="cine" class="hidden">
      <div id="cine-bars"><div class="bar top"></div><div class="bar bottom"></div></div>
      <div id="film" class="hidden">
        <div id="film-card"><div id="fc-bar"></div><div><div id="fc-name"></div><div id="fc-role"></div><div id="fc-loc"></div></div></div>
        <div id="film-title"><div id="ft-main"></div><div id="ft-sub"></div></div>
      </div>
      <div id="chapter" class="chapter hidden"></div>
      <div id="caption" class="caption hidden"></div>
      <div id="mission" class="mission hidden"></div>
      <div id="ai-alert" class="ai-alert hidden"></div>
      <button id="btn-skip" class="btn skip"><span class="gl" data-glyph="skip"></span><span data-i18n="cine.skip"></span></button>
    </div>
    <div id="subtitle" class="subtitle hidden"><span class="speaker"></span><span class="line"></span></div>

    <!-- HUD: nothing here is a panel. Things appear when they matter and leave again. -->
    <div id="hud" class="hidden">
      <div class="quest" id="objective">
        <div class="obj-title" id="obj-title"></div>
        <div class="obj-progress" id="obj-progress"></div>
        <div class="obj-desc" id="obj-desc"></div>
      </div>
      <div class="vitals" id="vitals">
        <div class="needs"><span class="need" data-stat="thirst"><i data-icon="thirst"></i></span><span class="need" data-stat="hunger"><i data-icon="hunger"></i></span></div>
        <div class="vbar" data-stat="health"><i></i></div>
      </div>
      <svg class="stamina" id="stamina" viewBox="0 0 40 40" aria-hidden="true"><circle class="s-bg" cx="20" cy="20" r="16"/><circle class="s-fg" cx="20" cy="20" r="16" pathLength="100"/></svg>
      <div class="wmark hidden" id="wmark"><i data-icon="marker"></i><span id="wmark-dist"></span></div>
      <div class="prompt hidden" id="prompt"><span class="gl" data-glyph="interact"></span><span class="ptext"></span></div>
      <div class="toasts" id="toasts"></div>
      <div class="banner hidden" id="banner"><div class="b-title"></div><div class="b-sub"></div></div>
      <div class="memory hidden" id="memory"></div>
      <div class="device hidden" id="device"></div>
      <div id="damage" class="damage"></div>
      <div id="tutorial" class="hint hidden"><span class="tut-text"></span></div>
      <div id="wheel" class="wheel hidden"><div class="wring"></div><div class="wmid"><div class="wname"></div><div class="wdesc"></div></div></div>
      <!-- Touch: floating stick, one context button, the bag, the menu -->
      <div id="touch" class="touch-ui hidden">
        <div id="joy-zone" class="joy-zone"><div id="joy" class="joy"><div id="joy-knob" class="joy-knob"></div></div></div>
        <button id="tb-pause" class="tbtn sm" aria-label="menu"><i data-icon="pause"></i></button>
        <button id="tb-inv" class="tbtn sm" aria-label="items"><i data-icon="inventory"></i></button>
        <button id="tb-codex" class="tbtn sm" aria-label="codex"><i data-icon="codex"></i></button>
        <button id="tb-act" class="tbtn big" aria-label="action"><i id="tb-act-ico" data-icon="jump"></i></button>
      </div>
    </div>

    <!-- Crafting minigame -->
    <div id="craft" class="craft hidden">
      <div class="mg-head"><b id="mg-name"></b><span id="mg-step"></span></div>
      <div class="mg-text" id="mg-text"></div>
      <div class="mg-tip hidden" id="mg-tip" data-i18n="mg.tip"></div>
      <div class="mg-gauge" id="mg-gauge" dir="ltr"><i class="band" id="mg-band"></i><i class="needle" id="mg-needle"></i></div>
      <div class="mg-state" id="mg-state"></div>
      <div class="mg-prog"><i id="mg-prog"></i></div>
      <div class="mg-keys" id="mg-keys"></div>
      <div class="mg-btns" dir="ltr"><button id="mg-left" class="mgb"></button><button id="mg-main" class="mgb main"></button><button id="mg-right" class="mgb"></button></div>
      <button id="mg-stop" class="mg-stop"></button>
    </div>
    <div id="disc" class="disc nav-layer hidden"></div>
    <!-- Conversations -->
    <div id="dialog" class="dialog nav-layer hidden">
      <div class="dlg-who" id="dlg-who"></div>
      <div class="dlg-line" id="dlg-line"></div>
      <div class="dlg-choices" id="dlg-choices"></div>
    </div>

    <!-- Modals -->
    <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
    <div id="safety" class="safety nav-layer hidden"></div>
    <div id="fps" class="fps hidden"></div>
    <noscript>This game needs JavaScript and WebGL2.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
