# The gates that do not need a real GPU, on every push to any branch and on pull requests. Each slow gate is its own
# job so they run side by side; each job builds the game itself (no artifacts: the account is at its storage limit,
# so a failure prints its log and nothing is uploaded). Browsers are headless Chromium with SwiftShader, as on the
# laptop, with Playwright pinned to 1.63 (tools/pw_pin.py says why).
name: Gates

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # spoiler_check: no known story spoiler in plain text in the tracked files or the built game (dist); the
          # phrases are kept privately, only their hashes are here. story_seal: the sealed Episode One data decodes
          - { name: build and typecheck, nobrowser: true, run: 'npx tsc --noEmit -p . && python3 tools/voice_check.py && python3 tools/spoiler_check.py dist && python3 tools/story_seal.py check && python3 tools/story_seal.py check --file src/game/branch/episode2.sealed && python3 tools/story_seal.py check --file src/game/branch/episode3.sealed' }
          - { name: smoke, run: 'python tools/smoke.py --quality web --out "$RUNNER_TEMP/shots"' }
          - { name: levels_smoke, run: 'python tools/levels_smoke.py --quality web --shots "$RUNNER_TEMP/shots"' }
          # Episode Two (levels 11 to 14) from a level 11 save, twice: one set of choices each way
          - { name: episode2_smoke, run: 'python tools/episode2_smoke.py --quality web && python tools/episode2_smoke.py --quality mobile --picks e2.snare=far,e2.voice=go,e2.stranger=spear,e2.mark=bare,e2.kiln=kept' }
          # Episode Three (levels 15 to 21) from a level 15 save, two sets of choices
          - { name: episode3_smoke, run: 'python tools/episode3_smoke.py --quality web && python tools/episode3_smoke.py --quality mobile --picks e3.site=camp,e3.door=view,e3.field=all,e3.dose=self,e3.wall=mock,e3.kit=eaten,e3.pello=in,e3.name=dayone && python tools/episode3_smoke.py --quality web --from 19 --flags hurt.draxum,draxum.waited --outcome e3.wall' }
          - { name: prologue_smoke, run: 'python tools/prologue_smoke.py --quality web' }
          - { name: intro_smoke, run: 'python tools/intro_smoke.py --quality web' }
          - { name: mobile_smoke, run: 'python tools/mobile_smoke.py --shots "$RUNNER_TEMP/shots"' }
          - { name: crowd_smoke, run: 'python tools/crowd_smoke.py' }
          - { name: traffic_smoke, run: 'python tools/traffic_smoke.py' }
          - { name: soak_smoke, run: 'python tools/soak_smoke.py' }
          # phones: the city's memory at process level on the Mobile preset (renderer + GPU process PSS on software GL,
          # 2.89 GB on the laptop on 2026-11-23 at the crowd spot): a tripwire for now, to come down towards the phones' 400 MB
          - { name: mobile_memory, run: 'python tools/soak_smoke.py --quality mobile --mem-only --proc-mb 3300' }
          - { name: perf_gate, run: 'python tools/perf_gate.py --out "$RUNNER_TEMP/perf.json"' }
          - { name: text_fit, run: 'python tools/text_fit.py --before --out "$RUNNER_TEMP/textfit.json"' }
          # words on 3D surfaces read the right way round (signs, boards, neon); no key hints on a touch screen
          - { name: signs_touch, run: 'python tools/sign_faces.py && python tools/touch_hints.py' }
          - { name: cutscene_qa, run: 'python tools/cutscene_qa.py --out "$RUNNER_TEMP/cutscene"' }
          # the opening is one room: furniture, who sits and stands, and where everyone is agree from cut to cut
          - { name: continuity, run: 'python tools/continuity_check.py --step 0.1' }
          # each of the six arrivals plays from its first frame to control (game/arrival.ts), and leaves them hurt
          - { name: landing_smoke, run: 'python tools/landing_smoke.py --quality web' }
          - { name: combat, run: 'node --experimental-strip-types tools/combat/sim_test.ts && node --experimental-strip-types tools/combat/pose_test.ts && python tools/combat/play_test.py' }
          - { name: anim_qa, run: 'python tools/anim_qa.py --serve --every 0 --out "$RUNNER_TEMP/anim_qa.json"' }
          - { name: anim_qa_pixels, run: 'python tools/anim_qa.py --serve --every 15 --only zenvik,nuvexa,custom_f_social --out "$RUNNER_TEMP/anim_qa_px.json"' }
          - { name: app_smoke, cap: true, run: 'python tools/android/app_smoke.py --shots "$RUNNER_TEMP/shots"' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Playwright browsers (cached)
        if: ${{ !matrix.nobrowser }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63-${{ runner.os }}

      - name: Playwright
        if: ${{ !matrix.nobrowser }}
        run: |
          pip install -q -r tools/requirements-test.txt
          python -m playwright install --with-deps chromium chromium-headless-shell
          # the tests ask Chromium for ANGLE on Vulkan (tools/smoke.py launch); a bare runner has no Vulkan loader,
          # so WebGL never starts. Lavapipe is the software Vulkan the laptop's WSL uses too.
          sudo apt-get install -y -q --no-install-recommends libvulkan1 mesa-vulkan-drivers > /dev/null

      - name: Copy the build into the Android app
        if: matrix.cap
        run: npx cap sync android

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
